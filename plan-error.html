
<!DOCTYPE html>

<html lang="ja">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>KASANARI - エラー</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP&amp;display=swap" rel="stylesheet"/>
<style>
    body {
      font-family: 'Noto Sans JP', sans-serif;
      background-color: #000;
      color: #fff;
    }
    .fade-in {
      animation: fadeIn 1s ease-in-out forwards;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body class="min-h-screen flex items-center justify-center px-6">
<div class="text-center max-w-lg fade-in">
<svg class="mx-auto mb-6 w-16 h-16 text-yellow-400" fill="none" stroke="currentColor" stroke-width="2" viewbox="0 0 24 24">
<path d="M12 9v2m0 4h.01M4.93 4.93a10 10 0 0114.14 0 10 10 0 010 14.14 10 10 0 01-14.14 0 10 10 0 010-14.14z" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
<h1 class="text-3xl font-bold mb-4">エラーが発生しました</h1>
<p class="text-gray-400 text-sm mb-8">処理中に問題が発生しました。お手数ですが、もう一度お試しください。</p>
<a class="inline-block bg-white text-black px-6 py-2 rounded hover:bg-gray-200 transition" href="/plan-edit">プラン選択に戻る</a>
</div>

<script>
  document.addEventListener("DOMContentLoaded", function () {
    const currentUser = localStorage.getItem("currentUser");
    if (!currentUser) {
      alert("ログインが必要です。");
      window.location.href = "login.html";
    }
  });
</script>
</body>
</html>
