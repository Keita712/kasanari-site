<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>人気映像ランキング</title>
  <style>
    table { border-collapse: collapse; width: 100%; margin-top: 20px; }
    th, td { padding: 8px 12px; border: 1px solid #ccc; text-align: left; }
    th { background-color: #f5f5f5; }
  </style>
</head>
<body>
  <h1>人気映像ランキング（TOP10）</h1>
  <table id="rankingTable">
    <thead>
      <tr><th>映像ID</th><th>再生数</th></tr>
    </thead>
    <tbody></tbody>
  </table>

  <script>
    fetch('http://192.168.11.18:3000/api/analytics/popular')
      .then(res => res.json())
      .then(data => {
        const tbody = document.querySelector('#rankingTable tbody');
        data.forEach(item => {
          const row = document.createElement('tr');
          row.innerHTML = `<td>${item.id}</td><td>${item.count}</td>`;
          tbody.appendChild(row);
        });
      });
  </script>
</body>
</html>
