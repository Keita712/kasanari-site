
<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ユーザー詳細 - KASANARI 管理</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    .custom-border { border: 1px solid #444; }
    .custom-link:hover { opacity: 0.8; text-decoration: underline; }
  </style>
</head>
<body class="bg-[#121212] text-white min-h-screen">

  <script>
    if (localStorage.getItem("adminLoggedIn") !== "true") {
      window.location.href = "login.html"; // ログインページへリダイレクト
    }
    function logout() {
      localStorage.removeItem("adminLoggedIn");
    }
  </script>

  <div class="max-w-3xl mx-auto p-6">
    <h1 class="text-2xl font-bold mb-6">ユーザー詳細</h1>
    <div class="space-y-4 bg-[#1A1A1A] p-6 rounded custom-border">
      <div><span class="text-gray-400">ユーザー名：</span>山田 太郎</div>
      <div><span class="text-gray-400">メールアドレス：</span>taro@example.com</div>
      <div><span class="text-gray-400">プラン：</span>スタンダード</div>
      <div><span class="text-gray-400">登録日：</span>2024-03-15</div>
      <div><span class="text-gray-400">最終ログイン：</span>2025-04-18</div>
    </div>
    <div class="mt-6 text-right">
      <a href="index.html" class="custom-link text-white">← ユーザー一覧に戻る</a>
    </div>
  </div>
</body>
</html>
