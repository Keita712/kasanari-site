
<!DOCTYPE html>

<html lang="ja">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>管理者ログイン - KASANARI</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#121212] text-white min-h-screen flex items-center justify-center">
<div class="w-full max-w-md bg-[#1A1A1A] rounded-xl shadow-xl p-8 space-y-6">
<h2 class="text-2xl font-bold text-center text-white tracking-wide">KASANARI 管理者ログイン</h2>
<div>
<label class="block mb-1 text-sm text-gray-300" for="adminEmail">メールアドレス</label>
<input class="w-full px-4 py-2 bg-[#2A2A2A] text-white border border-[#444] rounded focus:outline-none focus:ring-2 focus:ring-gray-400" id="adminEmail" required="" type="email"/>
</div>
<div>
<label class="block mb-1 text-sm text-gray-300" for="adminPassword">パスワード</label>
<input class="w-full px-4 py-2 bg-[#2A2A2A] text-white border border-[#444] rounded focus:outline-none focus:ring-2 focus:ring-gray-400" id="adminPassword" required="" type="password"/>
</div>
<button onclick="handleLogin()" class="w-full bg-[#333333] hover:bg-[#4D4D4D] text-white font-semibold py-2 rounded transition-colors duration-200" type="submit">ログイン</button>
</form>
<p class="text-red-500 text-sm text-center hidden" id="loginError">メールまたはパスワードが違います</p>

<button onclick="resetAdmin()" class="mt-4 text-sm text-red-400 hover:text-red-600 underline block text-center">
  管理者アカウントをリセット
</button>

</div>
<script>
    // 初回のみ保存
    if (!localStorage.getItem("adminEmail")) {
      localStorage.setItem("adminEmail", "tamukei712@yahoo.co.jp");
      localStorage.setItem("adminPassword", "Keit@712");
    }

    function handleLogin() {
      const email = document.getElementById("adminEmail").value;
      const password = document.getElementById("adminPassword").value;
      const storedEmail = localStorage.getItem("adminEmail");
      const storedPassword = localStorage.getItem("adminPassword");

      if (email === storedEmail && password === storedPassword) {
        localStorage.setItem("adminLoggedIn", "true");
        window.location.href = "dashboard.html";
      } else {
        document.getElementById("loginError").classList.remove("hidden");
      }
    }

    function resetAdmin() {
      localStorage.removeItem("adminEmail");
      localStorage.removeItem("adminPassword");
      alert("管理者アカウントをリセットしました。ページを再読み込みして再設定してください。");
    }

      // ⌨️ Enterキーでログインを実行する
  document.addEventListener("keydown", function (event) {
    if (event.key === "Enter") {
      event.preventDefault(); // フォーム送信防止
      handleLogin(); // ログイン関数を実行
    }
  });

  </script>
</body>
</html>
