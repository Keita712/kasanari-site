<!DOCTYPE html>
<html lang='ja'>
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>お知らせ編集 - KASANARI 管理</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
    .custom-border { border: 1px solid #444; }
  </style>
</head>
<body class="bg-[#121212] text-white min-h-screen p-6">
  <div class="max-w-6xl mx-auto space-y-10"><h1 class="text-2xl font-bold mb-6">お知らせの追加・編集</h1><form class="space-y-6 bg-[#1A1A1A] p-6 rounded custom-border">

  <script>
    if (localStorage.getItem("adminLoggedIn") !== "true") {
      window.location.href = "login.html"; // ログインページへリダイレクト
    }
    function logout() {
      localStorage.removeItem("adminLoggedIn");
    }
  </script>

  <div>
   <label class="block text-sm text-gray-300 mb-2" for="title">タイトル</label>
   <input class="w-full p-2 rounded bg-[#2A2A2A] text-white border border-[#444]" id="title" name="title" placeholder="例：サービスメンテナンスのお知らせ" type="text"/>
  </div>
  <div>
   <label class="block text-sm text-gray-300 mb-2" for="date">公開日</label>
   <input class="w-full p-2 rounded bg-[#2A2A2A] text-white border border-[#444]" id="date" name="date" type="date"/>
  </div>
  <div>
   <label class="block text-sm text-gray-300 mb-2" for="content">本文</label>
   <textarea class="w-full p-2 rounded bg-[#2A2A2A] text-white border border-[#444]" id="content" name="content" placeholder="ここに本文を入力してください。" rows="6"></textarea>
  </div>
  <div class="text-right">
   <button class="bg-white text-black font-semibold px-6 py-2 rounded hover:opacity-80 transition" type="submit">保存</button>
  </div>
  </form><h1 class="text-2xl font-bold mb-6">お知らせ一覧</h1><div class="space-y-4 bg-[#1A1A1A] p-6 rounded custom-border">
  <div class="custom-border p-4 rounded hover:bg-[#2A2A2A] transition">
   <a class="block hover-link text-lg font-semibold text-white" href="detail.html">【重要】システムメンテナンスのお知らせ</a>
   <p class="text-sm text-gray-400 mt-1">2025年4月15日</p>
  </div>
  <div class="custom-border p-4 rounded hover:bg-[#2A2A2A] transition">
   <a class="block hover-link text-lg font-semibold text-white" href="detail.html">新映像コンテンツ「水鏡の夜」追加のお知らせ</a>
   <p class="text-sm text-gray-400 mt-1">2025年4月10日</p>
  </div>
  <div class="custom-border p-4 rounded hover:bg-[#2A2A2A] transition">
   <a class="block hover-link text-lg font-semibold text-white" href="detail.html">【更新】利用規約の一部変更について</a>
   <p class="text-sm text-gray-400 mt-1">2025年3月31日</p>
  </div>
  </div>
  </div>
</body>
</html>
