
<!DOCTYPE html>

<html lang="ja">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>KASANARI</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP&amp;display=swap" rel="stylesheet"/>
<style>
    body {
      font-family: 'Noto Sans JP', sans-serif;
      background-color: #000;
      color: #fff;
    }
    .plan-card {
      aspect-ratio: 1.414 / 1;
      border: 1px solid #ffffff66;
      border-radius: 1rem;
      transition: transform 0.3s ease, border-color 0.3s ease;
    }
    .plan-card:hover {
      transform: scale(1.02);
      border-color: #ffffffaa;
    }
    .plan-card.selected {
    border-color: #ffffffaa !important;
    transform: scale(1.02);
    background-color: #1a1a1a;
    }
    .plan-name {
      color: white;
      font-weight: bold;
    }
    .dot {
      width: 10px;
      height: 10px;
      border-radius: 9999px;
      background-color: #666;
    }
    .dot.active {
      background-color: #fff;
    }
    .bar {
      height: 2px;
      background-color: #444;
      flex: 0.8;
      margin-bottom: 22px;
    }
    .step {
      display: flex;
      flex-direction: column;
      align-items: center;
      flex: 1;
    }
    .label {
      font-size: 10px;
      color: #aaa;
      margin-top: 6px;
      text-align: center;
    }
  </style>
</head>
<body class="min-h-screen px-6 py-10">
<!-- ステップバー -->
<section class="max-w-md mx-auto mb-8">
<div class="flex items-center justify-between">
<div class="step">
<div class="dot"></div>
<div class="label">登録</div>
</div>
<div class="bar"></div>
<div class="step">
<div class="dot active"></div>
<div class="label">プラン</div>
</div>
<div class="bar"></div>
<div class="step">
<div class="dot"></div>
<div class="label">支払い</div>
</div>
<div class="bar"></div>
<div class="step">
<div class="dot"></div>
<div class="label">確認</div>
</div>
<div class="bar"></div>
<div class="step">
<div class="dot"></div>
<div class="label">完了</div>
</div>
</div>
</section>
<h2 class="text-2xl font-semibold mb-8 text-center">ご希望のプランを選択してください</h2>
<form action="payment.html" method="GET" onsubmit="savePlan(); return true;">
<div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-10">
<label class="plan-card p-6 flex flex-col items-center justify-between text-center cursor-pointer">
  <input class="mb-4" name="plan" type="radio" value="Light"/>
  <div>
  <h3 class="plan-name text-xl mb-2">◆ Light ◆</h3>
  <p class="text-sm text-gray-300">映像5本、月替わり</p>
  </div>
  <p class="text-sm text-gray-500 mt-4">¥9,800/月（税別）</p>
</label>
<label class="plan-card p-6 flex flex-col items-center justify-between text-center cursor-pointer">
  <input class="mb-4" name="plan" type="radio" value="Standard"/>
  <div>
  <h3 class="plan-name text-xl mb-2">◆ Standard ◆</h3>
  <p class="text-sm text-gray-300">映像10本、自動切替・季節テーマ付</p>
  </div>
  <p class="text-sm text-gray-500 mt-4">¥14,800/月（税別）</p>
</label>
<label class="plan-card p-6 flex flex-col items-center justify-between text-center cursor-pointer">
  <input class="mb-4" name="plan" type="radio" value="Premium"/>
  <div>
  <h3 class="plan-name text-xl mb-2">◆ Premium ◆</h3>
  <p class="text-sm text-gray-300">全映像＋月1本カスタム＋ロゴ演出＋リアルタイム対応</p>
  </div>
  <p class="text-sm text-gray-500 mt-4">¥29,800/月（税別）</p>
</label>
</div>
<div class="text-center">
  <button class="bg-white text-black px-6 py-2 rounded hover:bg-gray-200 transition" type="submit">選択してお支払い方法へ</button>
</div>
</form>
<script>
function savePlan() {
  const plan = document.querySelector('input[name="plan"]:checked');
  if (plan) {
    const planValue = plan.value;
    // ✅ localStorageにも保存
    localStorage.setItem('selected_plan_display', planValue);
    // ✅ users[] にも保存（← 追加）
    const users = JSON.parse(localStorage.getItem("users") || "[]");
    const currentUserEmail = localStorage.getItem("currentUser");
    const userIndex = users.findIndex(u => u.email === currentUserEmail);
    if (userIndex !== -1) {
      users[userIndex].plan = planValue;
      localStorage.setItem("users", JSON.stringify(users));
    }

    fetch('/.netlify/functions/userinfo', {
      method: 'GET',
      credentials: 'include',
    });
  }

}
</script>

<script>
  document.addEventListener("DOMContentLoaded", function () {
    const cards = document.querySelectorAll(".plan-card");
    cards.forEach(card => {
      card.addEventListener("click", () => {
        cards.forEach(c => c.classList.remove("selected"));
        card.classList.add("selected");
      });
    });
  });
</script>
<script>
  function showConfirmation(action) {
    const confirmed = confirm(action === 'cancel' ? 'プランを解約してよろしいですか？' : 'プランを変更してよろしいですか？');
    if (confirmed) {
      window.location.href = action === 'cancel' ? '/cancel' : '/plan-change-complete';
    }
  }
</script>

</body></html>
