
<!DOCTYPE html>

<html lang="ja">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>お支払い方法の変更 - KASANARI</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP&amp;display=swap" rel="stylesheet"/>
<style>
    body {
      font-family: 'Noto Sans JP', sans-serif;
      background-color: #000;
      color: #fff;
    }
    input {
      background-color: #1a1a1a;
      border: 1px solid #444;
      color: white;
    }
    input:focus {
      outline: none;
      border-color: white;
      box-shadow: 0 0 0 1px white;
    }
  </style>
</head>
<body class="px-6 py-12">
<section class="max-w-xl mx-auto space-y-10">
<h1 class="text-3xl font-bold mb-2">お支払い方法の変更</h1>
<p class="text-gray-400 text-sm">新しいクレジットカード情報をご入力ください。</p>
<form action="/payment-change-complete" class="space-y-6" method="GET">
<div>
<label class="block text-sm mb-1">カード番号</label>
<input class="w-full px-4 py-2 rounded" name="card_number" placeholder="1234 5678 9012 3456" required="" type="text"/>
</div>
<div class="flex gap-4">
<div class="w-1/2">
<label class="block text-sm mb-1">有効期限（月/年）</label>
<input class="w-full px-4 py-2 rounded" name="expiry" placeholder="MM/YY" required="" type="text"/>
</div>
<div class="w-1/2">
<label class="block text-sm mb-1">セキュリティコード</label>
<input class="w-full px-4 py-2 rounded" name="cvc" placeholder="123" required="" type="password"/>
</div>
</div>
<div>
<label class="block text-sm mb-1">カード名義（半角英字）</label>
<input class="w-full px-4 py-2 rounded" name="card_name" placeholder="TARO YAMADA" required="" type="text"/>
</div>
<div class="text-center pt-6">
<button class="bg-white text-black px-8 py-2 rounded hover:bg-gray-200 transition" type="submit">
          支払い方法を変更する
        </button>
</div>
</form>
</section>

<script>
function savePaymentChange() {
  const cardNumber = document.getElementById('card_number').value.trim();
  const expiry = document.getElementById('expiry').value.trim();
  const cardName = document.getElementById('card_name').value.trim();
  const currentUserEmail = localStorage.getItem('currentUser');

  let users = JSON.parse(localStorage.getItem('users') || "[]");

  const userIndex = users.findIndex(u => u.email === currentUserEmail);
  if (userIndex !== -1) {
    users[userIndex].payment = {
      card_number: cardNumber,
      expiry: expiry,
      card_name: cardName
    };
    localStorage.setItem('users', JSON.stringify(users));
    alert('支払い情報を変更しました！');
  } else {
    alert('ユーザー情報が見つかりませんでした。');
  }

  return true;
}
</script>

<script>
nt.addEventListener("DOMContentLoaded", function () {
    const currentUser = localStorage.getItem("currentUser");
    if (!currentUser) {
      alert("ログインが必要です。");
      window.location.href = "login.html";
    }
  });
</script>
</body>
</html>
