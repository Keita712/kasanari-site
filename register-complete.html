
<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>KASANARI - プラン変更完了</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Noto Sans JP', sans-serif;
      background-color: #000;
      color: #fff;
    }
    .fade-in {
      animation: fadeIn 1s ease-in-out forwards;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .dot {
      width: 10px;
      height: 10px;
      border-radius: 9999px;
      background-color: #666;
    }
    .dot.active {
      background-color: #fff;
    }
    .bar {
      height: 2px;
      background-color: #444;
      flex: 0.8;
      margin-bottom: 22px;
    }
    .step {
      display: flex;
      flex-direction: column;
      align-items: center;
      flex: 1;
    }
    .label {
      font-size: 10px;
      color: #aaa;
      margin-top: 6px;
      text-align: center;
    }
  </style>
</head>
<body class="min-h-screen px-6 py-10">

  <!-- ステップバー -->
  <section class="max-w-md mx-auto mb-8">
    <div class="flex items-center justify-between">
      <div class="step">
        <div class="dot"></div>
        <div class="label">登録</div>
      </div>
      <div class="bar"></div>
      <div class="step">
        <div class="dot"></div>
        <div class="label">プラン</div>
      </div>
      <div class="bar"></div>
      <div class="step">
        <div class="dot"></div>
        <div class="label">支払い</div>
      </div>
      <div class="bar"></div>
      <div class="step">
        <div class="dot"></div>
        <div class="label">確認</div>
      </div>
      <div class="bar"></div>
      <div class="step">
        <div class="dot active"></div>
        <div class="label">完了</div>
      </div>
    </div>
  </section>

  <div class="text-center fade-in">
    <svg class="mx-auto mb-6 w-16 h-16 text-green-400" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
      <path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7" />
    </svg>
    <h1 class="text-3xl font-bold mb-4">登録が完了しました</h1>
    <p class="text-gray-400 text-sm mb-8">KASANARIのご利用を開始いただけます。<br>マイページより映像の選択や設定が可能です。</p>
    <a href="/dashboard" class="inline-block bg-white text-black px-6 py-2 rounded hover:bg-gray-200 transition">マイページへ</a>
  </div>
  <script>
    document.addEventListener("DOMContentLoaded", function() {
      const users = JSON.parse(localStorage.getItem('users')) || [];
      const currentUserEmail = localStorage.getItem('currentUser');

      const user = users.find(u => u.email === currentUserEmail);
      if (user) {
        localStorage.setItem('currentPlan', user.plan || "未登録");
      }
    });
  </script>
</body>
</html>
