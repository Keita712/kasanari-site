
<!DOCTYPE html>

<html lang="ja">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>FAQ - KASANARI</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP&amp;display=swap" rel="stylesheet"/>
<style>
    body {
      background-color: #000;
      color: #fff;
      font-family: 'Noto Sans JP', sans-serif;
    }
    input, textarea {
      background-color: #1a1a1a;
      border: 1px solid #444;
      color: white;
    }
    input:focus, textarea:focus {
      outline: none;
      border-color: white;
      box-shadow: 0 0 0 1px white;
    }
  </style>
</head>
<body class="min-h-screen px-6 py-10 space-y-16">
<!-- FAQセクション -->
<section>
<h1 class="text-3xl font-bold mb-6">よくあるご質問（FAQ）</h1>
<div class="space-y-4 text-sm">
<div>
<p class="font-medium text-white">Q. 音と映像は常に連動しますか？</p>
<p class="pt-1">A. はい、店舗内の音をリアルタイムで解析し、映像とシンクロさせます。</p>
</div>
<div>
<p class="font-medium text-white">Q. 映像の切り替えはどうすれば？</p>
<p class="pt-1">A. マイページのLine upで映像を選択するだけで反映されます。</p>
</div>
<div>
<p class="font-medium text-white">Q. 導入後の設定は必要ですか？</p>
<p class="pt-1">A. 初期設定済みの端末をお届けするため、特別な操作は不要です。</p>
</div>
<div>
<p class="font-medium text-white">Q. プランの変更や解約はいつでも可能ですか？</p>
<p class="pt-1">A. はい、マイページのプラン変更ページよりいつでもお手続きいただけます。</p>
</div>
</div>
</section>
<!-- お問い合わせフォームセクション -->
<section>
<h2 class="text-2xl font-semibold mb-6">問題が解決しない場合</h2>
<p class="text-gray-400 mb-6">以下のフォームからお気軽にお問い合わせください。</p>
<form action="/contact-complete" class="space-y-4 max-w-xl" method="GET">
<div>
<label class="block text-sm mb-1">お名前</label>
<input class="w-full px-4 py-2 rounded" name="name" required="" type="text"/>
</div>
<div>
<label class="block text-sm mb-1">メールアドレス</label>
<input class="w-full px-4 py-2 rounded" name="email" required="" type="email"/>
</div>
<div>
<label class="block text-sm mb-1">お問い合わせ内容</label>
<textarea class="w-full px-4 py-2 rounded" name="message" required="" rows="5"></textarea>
</div>
<div class="text-center mt-4">
<button class="bg-white text-black px-6 py-2 rounded hover:bg-gray-200 transition" type="submit">送信</button>
</div>
</form>
</section>

<script>
  document.addEventListener("DOMContentLoaded", function () {
    const currentUser = localStorage.getItem("currentUser");
    if (!currentUser) {
      alert("ログインが必要です。");
      window.location.href = "login.html";
    }
  });
</script>
</body>
</html>
