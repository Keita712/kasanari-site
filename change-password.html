
<!DOCTYPE html>

<html lang="ja">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>パスワード変更 - KASANARI</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
    body {
      background-color: #000;
      color: #fff;
      font-family: 'Noto Sans JP', sans-serif;
    }
    input {
      background-color: #1a1a1a;
      border: 1px solid #444;
      color: white;
    }
    input:focus {
      outline: none;
      border-color: white;
      box-shadow: 0 0 0 1px white;
    }
  </style>
</head>
<body class="px-6 py-12">
<section class="max-w-xl mx-auto space-y-8">
<h1 class="text-3xl font-bold mb-6">パスワードの変更</h1>
<form action="/change-password-complete" class="space-y-6" method="GET">
<div>
<label class="block text-sm mb-1">現在のパスワード</label>
<input class="w-full px-4 py-2 rounded" name="current_password" required="" type="password"/>
</div>
<div>
<label class="block text-sm mb-1">新しいパスワード</label>
<input class="w-full px-4 py-2 rounded" name="new_password" required="" type="password"/>
</div>
<div>
<label class="block text-sm mb-1">新しいパスワード（確認）</label>
<input class="w-full px-4 py-2 rounded" name="confirm_password" required="" type="password"/>
</div>
<div class="text-center pt-6">
<button class="bg-white text-black px-6 py-2 rounded hover:bg-gray-200 transition" type="submit">
          保存する
        </button>
</div>
</form>
</section>

<script>

function savePasswordChange() {
  const newPassword = document.getElementById('new_password').value.trim();
  const currentUserEmail = localStorage.getItem('currentUser');

  let users = JSON.parse(localStorage.getItem('users') || "[]");

  const userIndex = users.findIndex(u => u.email === currentUserEmail);
  if (userIndex !== -1) {
    users[userIndex].password = newPassword; // パスワードを更新
    localStorage.setItem('users', JSON.stringify(users));
    alert('パスワードを変更しました！');
  } else {
    alert('ユーザー情報が見つかりませんでした。');
  }

  return true;
}
</script>
<script>
  document.addEventListener("DOMContentLoaded", function () {
    const currentUser = localStorage.getItem("currentUser");
    if (!currentUser) {
      alert("ログインが必要です。");
      window.location.href = "login.html";
    }
  });
</script>
</body>
</html>
